            <div class="p-2.5 rounded-lg bg-[var(--card)] border border-[var(--border)] text-[11px] text-[var(--foreground)] leading-relaxed mt-2">

            </div>
          </div>
        `;

      relHtml += '</div></div>';

      container.innerHTML = plantsHtml + relHtml;
    }

    // --- 4. SALES & INVENTORY TAB ---

            <div class="text-xs text-[var(--muted-foreground)] font-semibold">Average Inventory Age</div>
            <div class="text-2xl font-extrabold text-[var(--foreground)] mt-1">${sum.avg_inventory_age} Days</div>
            <div class="text-[11px] text-[var(--muted-foreground)] mt-0.5">Target benchmark: 30 - 45 days</div>

              <div class="font-bold text-[10px] uppercase text-[var(--muted-foreground)]">Recommended Actions:</div>
              ${r.actions.map(a => `<div class="text-[11px] text-[var(--foreground)] flex items-start gap-1.5"><span>•</span><span>${a}</span></div>`).join('')}
            </div>
          </div>
        `;
      });
      recHtml += '</div>';

      // Model Scorecard Table
      let tableHtml = `
        <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-5 shadow-sm overflow-hidden">
          <h3 class="text-sm font-bold text-[var(--foreground)] mb-3">Vehicle Models Performance Scorecard (${currentQuarter})</h3>
          <div class="overflow-x-auto text-xs">
            <table class="w-full text-left">
              <thead class="bg-[var(--background)] text-[var(--muted-foreground)] uppercase border-b border-[var(--border)]">
                <tr>
                  <th class="p-2.5">Model</th>
                  <th class="p-2.5 text-right">Units Sold</th>
                  <th class="p-2.5 text-right">Target</th>
                  <th class="p-2.5 text-right">Achievement</th>
                  <th class="p-2.5 text-right">ASP (Lakh)</th>
                  <th class="p-2.5 text-right">Yard Units</th>
                  <th class="p-2.5 text-right">Age (Days)</th>
                  <th class="p-2.5 text-right">Holding Cost</th>
                  <th class="p-2.5 text-center">Status</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-[var(--border)]">
      `;
      qData.models_data.forEach(m => {
        tableHtml += `
          <tr class="${m.is_slow_moving ? 'bg-rose-500/5 font-semibold' : ''}">
            <td class="p-2.5 font-bold">${m.model}</td>

            <td class="p-2.5 text-right">₹${m.asp_lakh.toFixed(2)}L</td>
            <td class="p-2.5 text-right">${m.inventory_units.toLocaleString()}</td>
            <td class="p-2.5 text-right font-bold ${m.inventory_age_days > 55 ? 'text-rose-600' : ''}">${m.inventory_age_days} d</td>
            <td class="p-2.5 text-right text-purple-600 font-bold">₹${m.holding_cost_cr.toFixed(2)} Cr</td>
            <td class="p-2.5 text-center">
              <span class="px-2 py-0.5 rounded text-[10px] font-bold ${m.is_slow_moving ? 'bg-rose-500/20 text-rose-700 dark:text-rose-300' : 'bg-emerald-500/20 text-emerald-700 dark:text-emerald-300'}">

      tableHtml += '</tbody></table></div></div>';

    // --- 5. AI INSIGHTS TAB ---
    function renderInsights(container, qData) {
      let filterBtns = ['ALL', 'High', 'Medium', 'Low'].map(sev => `
        <button onclick="filterSeverity('${sev}')" class="px-3 py-1 rounded-xl text-xs font-semibold ${currentSeverity === sev ? 'bg-blue-600 text-white font-bold' : 'border border-[var(--border)] bg-[var(--card)] text-[var(--muted-foreground)]'}">
          ${sev === 'ALL' ? 'All Findings' : sev + ' Priority'}
        </button>
      `).join('');

      let headerHtml = `
        <div class="bg-gradient-to-r from-slate-900 via-indigo-950 to-blue-950 text-white rounded-2xl p-5 border border-indigo-900/60 shadow-md space-y-3">
          <div class="flex items-center justify-between">
            <div class="font-bold text-sm tracking-tight">Executive Decision Intelligence Briefing — ${currentQuarter}</div>
            <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">Local Rules Engine Active</span>
          </div>
          <p class="text-xs text-slate-200 leading-relaxed">${qData.exec_summary}</p>
        </div>

        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">${filterBtns}</div>
          <div class="text-xs text-[var(--muted-foreground)]">Showing filtered findings</div>
        </div>
      `;

      const filtered = currentSeverity === 'ALL' ? qData.insights : qData.insights.filter(i => i.severity === currentSeverity);

      let listHtml = '<div class="space-y-4">';
      filtered.forEach(ins => {
        const isHigh = ins.severity === 'High';
        const isMed = ins.severity === 'Medium';
        const sevClass = isHigh ? 'bg-rose-500/20 text-rose-700 dark:text-rose-300' : (isMed ? 'bg-amber-500/20 text-amber-700 dark:text-amber-300' : 'bg-blue-500/20 text-blue-700 dark:text-blue-300');

        listHtml += `
          <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-5 shadow-sm space-y-3">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="px-2 py-0.5 rounded font-bold text-[10px] ${sevClass}">${ins.severity} Priority</span>
                <h3 class="text-sm font-bold text-[var(--foreground)]">${ins.title}</h3>
              </div>
              <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-600 border border-emerald-500/20">${ins.confidence}</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 p-3 rounded-xl bg-[var(--background)] border border-[var(--border)] text-xs">
              <div><span class="text-[var(--muted-foreground)] text-[10px] block">Affected KPI</span><strong>${ins.affected_kpi}</strong></div>
              <div><span class="text-[var(--muted-foreground)] text-[10px] block">Observed Value</span><strong class="text-rose-600">${ins.current_value}</strong></div>
              <div><span class="text-[var(--muted-foreground)] text-[10px] block">Benchmark</span><strong>${ins.comparison_value}</strong></div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs leading-relaxed">
              <div class="p-3 rounded-xl bg-[var(--background)] border border-[var(--border)]">
                <strong class="text-[10px] uppercase text-[var(--muted-foreground)] block mb-1">Empirical Evidence:</strong>
                ${ins.evidence}
              </div>
              <div class="p-3 rounded-xl bg-[var(--background)] border border-[var(--border)]">
                <strong class="text-[10px] uppercase text-[var(--muted-foreground)] block mb-1">Potential Business Impact:</strong>
                ${ins.business_impact}
              </div>
            </div>
            <div class="p-3 rounded-xl bg-blue-500/10 border border-blue-500/20 text-blue-900 dark:text-blue-200 text-xs leading-relaxed">
              <strong>Prescribed Management Action:</strong> ${ins.recommendation}
            </div>
          </div>
        `;
      });
      listHtml += '</div>';

      container.innerHTML = headerHtml + listHtml;
    }

    function filterSeverity(sev) {
      currentSeverity = sev;
      renderCurrentTab();
    }

    // --- 6. DATA EXPLORER TAB ---
    function renderDataExplorer(container, qData) {
      let html = `
        <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-5 shadow-sm space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-sm font-bold text-[var(--foreground)]">Worksheet Preview: Financial Performance</h3>
            <button onclick="exportCurrentCSV()" class="px-3 py-1.5 text-xs font-semibold rounded-xl bg-emerald-600 text-white hover:bg-emerald-700">Download CSV</button>
          </div>
          <div class="overflow-x-auto max-h-80 overflow-y-auto text-xs">
            <table class="w-full text-left">
              <thead class="bg-[var(--background)] text-[var(--muted-foreground)] uppercase border-b border-[var(--border)]">
                <tr>
                  <th class="p-2.5">Quarter</th>
                  <th class="p-2.5 text-right">Revenue (₹ Cr)</th>
                  <th class="p-2.5 text-right">Cost (₹ Cr)</th>
                  <th class="p-2.5 text-right">Op Profit (₹ Cr)</th>
                  <th class="p-2.5 text-right">Net Profit (₹ Cr)</th>
                  <th class="p-2.5 text-right">Profit Margin %</th>
                  <th class="p-2.5 text-right">Cash Flow (₹ Cr)</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-[var(--border)]">
      `;
      qData.fin_trends.forEach(r => {
        html += `
          <tr class="hover:bg-[var(--background)]">
            <td class="p-2.5 font-bold">${r.quarter}</td>
            <td class="p-2.5 text-right font-mono">₹${r.revenue.toLocaleString()}</td>
            <td class="p-2.5 text-right font-mono">₹${r.operating_cost.toLocaleString()}</td>
            <td class="p-2.5 text-right font-mono">₹${r.operating_profit.toLocaleString()}</td>
            <td class="p-2.5 text-right font-mono">₹${r.net_profit.toLocaleString()}</td>
            <td class="p-2.5 text-right font-mono">${r.profit_margin_pct}%</td>
            <td class="p-2.5 text-right font-mono">₹${r.cash_flow.toLocaleString()}</td>
          </tr>
        `;
      });
      html += '</tbody></table></div></div>';
      container.innerHTML = html;
    }

    // --- CSV EXPORTER ---
    function exportCurrentCSV() {
      const qData = DATA.by_q[currentQuarter];
      if (!qData) return;
      let csv = 'Quarter,Revenue_Cr,Operating_Cost_Cr,Operating_Profit_Cr,Net_Profit_Cr,Profit_Margin_Pct,Cash_Flow_Cr\n';
      qData.fin_trends.forEach(r => {
        csv += `${r.quarter},${r.revenue},${r.operating_cost},${r.operating_profit},${r.net_profit},${r.profit_margin_pct},${r.cash_flow}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `tata_motors_financial_${currentQuarter}.csv`;
      a.click();
    }

    // --- SVG CHART RENDERERS ---
    function renderLineAreaChart(data, xKey, yKeys, colors, names) {
      const w = 550, h = 230, padL = 45, padR = 20, padT = 20, padB = 30;
      let allY = [];
      data.forEach(d => yKeys.forEach(k => allY.push(d[k])));
      const minY = Math.min(...allY) * 0.95;
      const maxY = Math.max(...allY) * 1.05;

      const scaleX = i => padL + (i / (data.length - 1)) * (w - padL - padR);
      const scaleY = v => padT + (1 - (v - minY) / (maxY - minY)) * (h - padT - padB);

      let gridLines = '';
      for (let s = 0; s <= 4; s++) {
        const val = minY + (s / 4) * (maxY - minY);
        const y = scaleY(val);
        gridLines += `<line x1="${padL}" y1="${y}" x2="${w - padR}" y2="${y}" stroke="#94A3B8" stroke-opacity="0.2" stroke-dasharray="3,3"/>`;
        gridLines += `<text x="${padL - 6}" y="${y + 4}" font-size="9" fill="#64748B" text-anchor="end">₹${Math.round(val/1000)}k</text>`;
      }

      let paths = '';
      yKeys.forEach((k, ki) => {
        const pts = data.map((d, i) => `${scaleX(i).toFixed(1)},${scaleY(d[k]).toFixed(1)}`).join(' ');
        paths += `<polyline fill="none" stroke="${colors[ki]}" stroke-width="2.5" points="${pts}"/>`;
        data.forEach((d, i) => {
          paths += `<circle cx="${scaleX(i)}" cy="${scaleY(d[k])}" r="3" fill="${colors[ki]}" />`;
        });
      });

      let xLabels = '';
      data.forEach((d, i) => {
        if (i % 2 === 0 || i === data.length - 1) {
          xLabels += `<text x="${scaleX(i)}" y="${h - 8}" font-size="9" fill="#64748B" text-anchor="middle">${d[xKey]}</text>`;
        }
      });

      return `<svg viewBox="0 0 ${w} ${h}" class="w-full h-full overflow-visible">${gridLines}${paths}${xLabels}</svg>`;
    }

    function renderComposedBarLineChart(data) {
      const w = 550, h = 230, padL = 45, padR = 40, padT = 20, padB = 30;
      const maxProfit = Math.max(...data.map(d => d.net_profit)) * 1.15;
      const maxMargin = 16;

      const scaleX = i => padL + (i / (data.length - 1)) * (w - padL - padR);
      const scaleYProfit = v => padT + (1 - v / maxProfit) * (h - padT - padB);
      const scaleYMargin = v => padT + (1 - v / maxMargin) * (h - padT - padB);

      let bars = '';
      let linePts = [];
      data.forEach((d, i) => {
        const x = scaleX(i);
        const yP = scaleYProfit(d.net_profit);
        bars += `<rect x="${x - 6}" y="${yP}" width="12" height="${h - padB - yP}" fill="#6366F1" rx="2" opacity="0.85" />`;
        linePts.push(`${x.toFixed(1)},${scaleYMargin(d.operating_margin).toFixed(1)}`);
      });

      let xLabels = '';
      data.forEach((d, i) => {
        if (i % 2 === 0 || i === data.length - 1) {
          xLabels += `<text x="${scaleX(i)}" y="${h - 8}" font-size="9" fill="#64748B" text-anchor="middle">${d.quarter}</text>`;
        }
      });

      return `
        <svg viewBox="0 0 ${w} ${h}" class="w-full h-full overflow-visible">
          <line x1="${padL}" y1="${h - padB}" x2="${w - padR}" y2="${h - padB}" stroke="#94A3B8" stroke-opacity="0.3"/>
          ${bars}
          <polyline fill="none" stroke="#10B981" stroke-width="2.5" points="${linePts.join(' ')}" />
          ${xLabels}
        </svg>
      `;
    }

    function renderSimpleLineChart(data, xKey, yKeys, colors) {
      const w = 340, h = 180, padL = 30, padR = 15, padT = 15, padB = 25;
      const scaleX = i => padL + (i / (data.length - 1)) * (w - padL - padR);
      const pts1 = data.map((d, i) => `${scaleX(i).toFixed(1)},${(padT + (1 - d[yKeys[0]]/100) * (h - padT - padB)).toFixed(1)}`).join(' ');
      const pts2 = data.map((d, i) => `${scaleX(i).toFixed(1)},${(padT + (1 - d[yKeys[1]]/15) * (h - padT - padB)).toFixed(1)}`).join(' ');
      return `
        <svg viewBox="0 0 ${w} ${h}" class="w-full h-full overflow-visible">
          <line x1="${padL}" y1="${h - padB}" x2="${w - padR}" y2="${h - padB}" stroke="#94A3B8" stroke-opacity="0.2"/>
          <polyline fill="none" stroke="${colors[0]}" stroke-width="2" points="${pts1}" />
          <polyline fill="none" stroke="${colors[1]}" stroke-width="2" points="${pts2}" />
        </svg>
      `;
    }

    function renderHorizontalBarChart(data, labelKey, valKey, color) {
      const max = Math.max(...data.map(d => d[valKey]));
      return `
        <div class="space-y-2 pt-2">
          ${data.map(d => `
            <div class="space-y-0.5 text-xs">
              <div class="flex justify-between text-[11px] font-semibold text-[var(--foreground)]">
                <span>${d[labelKey]}</span>
                <span>₹${d[valKey]} Cr</span>
              </div>
              <div class="w-full bg-[var(--background)] h-3 rounded-full overflow-hidden border border-[var(--border)]">
                <div class="h-full rounded-full" style="width: ${(d[valKey]/max*100).toFixed(1)}%; background-color: ${color};"></div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderGroupedBarChart(data) {
      const max = Math.max(...data.map(d => Math.max(d.sales_target, d.units_sold)));
      return `
        <div class="space-y-2 pt-1">
          ${data.map(d => `
            <div class="space-y-0.5 text-xs">
              <div class="flex justify-between text-[11px] text-[var(--muted-foreground)]">
                <span class="font-bold text-[var(--foreground)]">${d.model}</span>
                <span>${d.units_sold.toLocaleString()} / ${d.sales_target.toLocaleString()} (${d.achievement_pct}%)</span>
              </div>
              <div class="w-full bg-[var(--background)] h-2.5 rounded-full overflow-hidden flex gap-1">
                <div class="h-full bg-blue-500 rounded-full" style="width: ${(d.units_sold/max*100).toFixed(1)}%;"></div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    // Initialize View
    switchTab('overview');
  </script>
